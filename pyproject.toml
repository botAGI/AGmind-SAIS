[project]
name = "agmind-immune-core"
version = "0.1.0"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "cryptography==49.0.0",
  "fastapi==0.140.0",
  "google-crc32c==1.8.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.161.5",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["core"]
asyncio_mode = "strict"
markers = ["linux_integration: requires the native supported Linux boundary"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agmind_immune"]
mypy_path = "core"
